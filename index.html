<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox Zero — Triage Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEAE0;
    --paper-raised:#F7F3EA;
    --ink:#20281F;
    --ink-soft:#54594D;
    --line:#D8D0BE;
    --rust:#9C3D27;
    --teal:#2F6F62;
    --gold:#C98A2B;
    --slate:#3E5C76;
    --stone:#8B8578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{ max-width:600px; margin:0 auto; padding:22px 18px 60px; }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .masthead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:10px;
  }
  .masthead h1{ font-size:26px; }
  .masthead .sub{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .team-chip{ font-size:11px; background:var(--ink); color:var(--paper); padding:4px 9px; border-radius:2px; white-space:nowrap; }
  .live-dot{ display:inline-block; width:6px;height:6px; border-radius:50%; background:var(--teal); margin-right:5px; animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .subtle-link{ text-align:center; font-size:10.5px; color:var(--ink-soft); opacity:0.7; text-decoration:underline; cursor:pointer; margin-top:10px; }
  .link-row{ display:flex; justify-content:center; gap:18px; margin-top:16px; flex-wrap:wrap; }

  .landing-card{ background:var(--paper-raised); border:1px solid var(--line); padding:22px; margin-bottom:16px; }
  .landing-card p{ line-height:1.6; font-size:13.5px; color:var(--ink); margin:0 0 12px; }
  .landing-card p:last-child{ margin-bottom:0; }
  input[type=text]{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:14px; padding:11px;
    border:1.5px solid var(--ink); background:#fff; color:var(--ink); margin-bottom:12px;
  }
  .btn{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600;
    border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
    padding:11px 18px; cursor:pointer; text-align:center; width:100%; transition:transform .08s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn.secondary{ background:transparent; color:var(--ink); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .stack{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }

  .new-mail-banner{
    background:var(--teal); color:#fff; padding:10px 14px; font-size:12.5px; font-weight:600;
    text-align:center; margin-bottom:14px;
  }

  .inbox-list{ border:1px solid var(--line); background:var(--paper-raised); margin-bottom:16px; }
  .inbox-row{ display:flex; gap:10px; padding:13px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .inbox-row:last-child{ border-bottom:none; }
  .inbox-row:hover{ background:rgba(0,0,0,0.025); }
  .inbox-row.handled{ opacity:0.55; }
  .inbox-row .dot{ width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0; }
  .inbox-row .meta{ flex:1; min-width:0; }
  .row-top{ display:flex; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--ink-soft); }
  .row-subject{ font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; margin-top:2px; }
  .row-preview{ font-size:12px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-chip{ font-size:9px; font-weight:600; color:#fff; padding:1px 6px; border-radius:2px; flex-shrink:0; align-self:flex-start; }
  .locked-row{ padding:18px 14px; text-align:center; font-size:12px; color:var(--ink-soft); font-style:italic; background:rgba(0,0,0,0.015); }

  .detail-back{ font-size:12px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; margin-bottom:12px; display:inline-block; background:none; border:none; font-family:'IBM Plex Mono',monospace; padding:0; }

  .memo{ background:var(--paper-raised); border:1px solid var(--line); position:relative; margin-bottom:16px; }
  .ribbon{
    position:absolute; top:-1px; left:16px; transform:translateY(-50%);
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; letter-spacing:0.04em; color:#fff; padding:3px 9px;
  }
  .memo-body{ padding:18px; }
  .memo-body.with-ribbon{ padding-top:26px; }
  .memo-row{ font-size:12.5px; color:var(--ink-soft); margin-bottom:3px; }
  .memo-row b{ color:var(--ink); font-weight:600; }
  .memo-subject{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin:8px 0 12px; line-height:1.3; }
  .memo-text{ font-size:13.5px; line-height:1.65; white-space:pre-line; margin-bottom:12px; }
  .memo-img{ width:100%; height:auto; border:1px solid var(--line); margin-bottom:12px; display:block; }
  .memo-box{
    border-left:3px solid var(--ink-soft); background:rgba(0,0,0,0.03); padding:10px 12px;
    font-size:12.5px; line-height:1.6; margin-bottom:12px; white-space:pre-line;
  }
  .memo-box .label{ display:block; font-size:10.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; letter-spacing:0.03em; }
  .memo-footer{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:10px; margin-top:4px; }
  .material-btn{
    display:inline-block; font-size:11.5px; font-weight:600; color:var(--slate); border:1px solid var(--slate);
    background:transparent; padding:7px 11px; cursor:pointer; margin-bottom:12px; font-family:'IBM Plex Mono',monospace;
  }

  .stamp-row{ display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:14px; }
  .stamp{
    border:2px solid var(--ink); background:transparent; color:var(--ink);
    font-family:'Fraunces', serif; font-weight:600; font-size:14px; padding:13px 6px; cursor:pointer;
    text-align:center; letter-spacing:0.02em; transform:rotate(-1deg);
  }
  .stamp:nth-child(2){ transform:rotate(1deg); }
  .stamp:nth-child(3){ transform:rotate(1deg); }
  .stamp:nth-child(4){ transform:rotate(-1deg); }
  .stamp.active{ color:#fff; transform:rotate(0deg) scale(1.03); }

  textarea{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:13px; padding:10px;
    border:1px solid var(--line); background:#fff; resize:vertical; min-height:76px; margin-bottom:12px; color:var(--ink);
  }
  textarea::placeholder{ color:#A39B86; }
  label.field-label{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .required-mark{ color:var(--rust); }
  .confirm-hint{ font-size:12px; color:var(--ink-soft); margin:6px 0 2px; min-height:14px; }

  .nav-row{ display:flex; gap:8px; }
  .nav-row .btn{ flex:1; }

  .review-email{ background:var(--paper-raised); border:1px solid var(--line); padding:16px; margin-bottom:14px; }
  .original-email{ border:1px dashed var(--line); padding:10px 12px; margin-bottom:12px; background:rgba(0,0,0,0.015); }
  .original-email summary{ cursor:pointer; font-size:11.5px; font-weight:600; color:var(--slate); }
  .original-email .memo-row{ margin-top:8px; }
  .original-email .memo-text{ margin-top:6px; }
  .review-email h3{ font-size:16px; margin-bottom:10px; }
  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .bar-label{ width:66px; font-size:10.5px; font-weight:600; flex-shrink:0; }
  .bar-track{ flex:1; height:14px; background:var(--line); position:relative; }
  .bar-fill{ height:100%; }
  .bar-count{ width:20px; font-size:11px; text-align:right; flex-shrink:0; }
  .suggested-note{
    font-size:11.5px; color:var(--ink-soft); background:rgba(0,0,0,0.03);
    border-left:3px solid var(--gold); padding:8px 10px; margin:10px 0; line-height:1.55;
  }
  .facilitator-note{
    font-size:11.5px; color:var(--ink-soft); background:rgba(0,0,0,0.03);
    border-left:3px solid var(--slate); padding:8px 10px; margin:10px 0; line-height:1.55; white-space:pre-line;
  }
  .team-answers{ margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; }
  .team-answer{ font-size:12px; margin-bottom:8px; line-height:1.55; }
  .team-answer .who{ font-weight:600; }
  .chip{ display:inline-block; font-size:9.5px; font-weight:600; color:#fff; padding:1px 6px; border-radius:2px; margin-left:6px; }
  .empty-note{ font-size:12px; color:var(--ink-soft); font-style:italic; }
  .footer-link{ text-align:center; margin-top:22px; font-size:11px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; }
  .setup-warning{ background:#fff3f0; border:1px solid var(--rust); color:var(--rust); padding:14px; font-size:12.5px; line-height:1.6; margin-bottom:16px; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-box{ background:var(--paper-raised); max-width:520px; width:100%; max-height:85vh; overflow:auto; padding:20px; border:1px solid var(--line); position:relative; }
  .modal-close{ position:absolute; top:10px; right:12px; cursor:pointer; font-size:16px; background:none; border:none; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }
  .modal-box img{ width:100%; height:auto; display:block; margin-top:10px; border:1px solid var(--line); }
  .modal-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin-bottom:10px; padding-right:24px; }
  .modal-box ul{ font-size:12.5px; line-height:1.7; margin:0; padding-left:18px; }
</style>

var ALL_EMAILS = WARMUP_EMAILS.concat(EMAILS);

var ACTIONS = [
  {key:'DELETE', color:'var(--stone)'},
  {key:'DELEGATE', color:'var(--slate)'},
  {key:'DO', color:'var(--teal)'},
  {key:'DEFER', color:'var(--gold)'}
];

var state = {
  screen: 'landing', // landing | inbox | detail | warmupDone | warmupReview | done | review
  round: 'warmup', // warmup | main
  teamCode: null,
  openId: null,
  answers: {},
  warmupUnlocked: WARMUP_BATCH_SIZES[0],
  mainUnlocked: BATCH_SIZES[0],
  unlockBanner: 0
};

function currentEmails(){ return state.round === 'warmup' ? WARMUP_EMAILS : EMAILS; }
function currentBatchSizes(){ return state.round === 'warmup' ? WARMUP_BATCH_SIZES : BATCH_SIZES; }
function currentUnlockedCount(){ return state.round === 'warmup' ? state.warmupUnlocked : state.mainUnlocked; }
function setCurrentUnlockedCount(v){ if(state.round === 'warmup') state.warmupUnlocked = v; else state.mainUnlocked = v; }
function countHandled(list){
  return list.filter(function(e){ return state.answers[e.id] && state.answers[e.id].action; }).length;
}
var unsubscribeReview = null;

function docIdFor(teamCode){ return teamCode.trim().replace(/[^a-zA-Z0-9]+/g, '-'); }
function getHashCode(){
  var h = decodeURIComponent(window.location.hash.replace('#',''));
  return h && h.length ? h : null;
}
function setHashCode(code){ window.location.hash = encodeURIComponent(code); }

function setSyncStatus(text, isError){
  var el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? 'var(--rust)' : 'var(--ink-soft)';
}

function saveSubmission(){
  if(!state.teamCode || !db) return Promise.resolve();
  var record = {
    teamCode: state.teamCode,
    answers: JSON.parse(JSON.stringify(state.answers)),
    round: state.round,
    warmupUnlocked: state.warmupUnlocked,
    mainUnlocked: state.mainUnlocked,
    updatedAt: new Date().toISOString()
  };
  setSyncStatus('Saving…', false);
  var p = setDoc(doc(db, COLLECTION_NAME, docIdFor(state.teamCode)), record, {merge:true});
  var timedOut = false;
  var timer = setTimeout(function(){ timedOut = true; setSyncStatus('Still trying to sync… check your connection', true); }, 6000);
  p.then(function(){
    clearTimeout(timer);
    setSyncStatus(timedOut ? 'Synced ✓ (slow connection)' : 'Synced ✓', false);
  }).catch(function(e){
    clearTimeout(timer);
    console.error('save failed', e);
    setSyncStatus('Save failed — check Firestore rules/config', true);
  });
  return p;
}

function esc(s){
  var d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function openModal(title, bodyHtml){
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = '<div class="modal-box"><button class="modal-close" id="modal-close-btn">Close \u2715</button>' +
    '<div class="modal-title">'+esc(title)+'</div>' + bodyHtml + '</div>';
  backdrop.onclick = function(ev){ if(ev.target===backdrop) document.body.removeChild(backdrop); };
  document.body.appendChild(backdrop);
  document.getElementById('modal-close-btn').onclick = function(){ document.body.removeChild(backdrop); };
}

function allHandledThrough(list, n){
  for(var i=0;i<n;i++){
    var a = state.answers[list[i].id];
    if(!a || !a.action) return false;
  }
  return true;
}

function maybeUnlockNext(){
  var list = currentEmails();
  var sizes = currentBatchSizes();
  var unlocked = currentUnlockedCount();
  if(unlocked >= list.length) return 0;
  if(!allHandledThrough(list, unlocked)) return 0;
  var cum = 0, newCount = unlocked;
  for(var i=0;i<sizes.length;i++){
    cum += sizes[i];
    if(cum > unlocked){ newCount = Math.min(cum, list.length); break; }
  }
  var gained = newCount - unlocked;
  if(gained > 0) setCurrentUnlockedCount(newCount);
  return gained;
}

function render(){
  if(unsubscribeReview && state.screen!=='review' && state.screen!=='warmupReview'){ unsubscribeReview(); unsubscribeReview = null; }
  var app = document.getElementById('app');
  if(needsSetup){ app.innerHTML = setupHTML(); return; }
  if(state.screen==='landing') app.innerHTML = landingHTML();
  else if(state.screen==='inbox') app.innerHTML = inboxHTML();
  else if(state.screen==='detail') app.innerHTML = detailHTML();
  else if(state.screen==='warmupDone') app.innerHTML = warmupDoneHTML();
  else if(state.screen==='done') app.innerHTML = doneHTML();
  else if(state.screen==='review'){ app.innerHTML = reviewShellHTML(); bindReviewLive(reviewBodyHTML, true); bindEvents(); return; }
  else if(state.screen==='warmupReview'){ app.innerHTML = warmupReviewShellHTML(); bindReviewLive(warmupReviewBodyHTML, false); bindEvents(); return; }
  bindEvents();
}

function landingHTML(){

    '</div>' +

      '<span class="subtle-link" id="btn-skip-warmup">Skip Round 1 \u2192 go straight to the main round</span>' +
    '</div>';

function inboxHTML(){
  var list = currentEmails();
  var unlockedCount = currentUnlockedCount();
  var handledCount = countHandled(list);
  var banner = '';
  if(state.unlockBanner > 0){
    banner = '<div class="new-mail-banner">\ud83d\udce9 '+state.unlockBanner+' new email'+(state.unlockBanner===1?'':'s')+' just arrived</div>';
    state.unlockBanner = 0;
  }

  var rows = '';
  for(var i=unlockedCount-1;i>=0;i--){
    var e = list[i];
    var a = state.answers[e.id];
    var handled = a && a.action;
    var preview = e.body.replace(/\n/g,' ').slice(0,70);
    var dotColor = e.tagColor || 'var(--stone)';
    var flag = e.tag ? '\ud83d\udd34 ' : '';
    rows += '<div class="inbox-row'+(handled?' handled':'')+'" data-open="'+e.id+'">' +
      '<div class="dot" style="background:'+dotColor+'"></div>' +
      '<div class="meta">' +
        '<div class="row-top"><span>'+flag+esc(e.from)+'</span><span>'+esc(e.time)+'</span></div>' +
        '<div class="row-subject">'+esc(e.subject)+'</div>' +
        '<div class="row-preview">'+esc(preview)+'\u2026</div>' +
      '</div>' +
      (handled ? '<span class="row-chip" style="background:'+(ACTIONS.find(function(ac){return ac.key===a.action;})||{}).color+'">'+a.action+'</span>' : '') +
    '</div>';
  }
  var lockedRemaining = list.length - unlockedCount;
  var lockedHTML = lockedRemaining > 0
    ? '<div class="locked-row">\ud83d\udd12 '+lockedRemaining+' more email'+(lockedRemaining===1?'':'s')+' will arrive once this batch is cleared</div>'
    : '';

  return masthead('Email '+unlockedCount+' unlocked \u00b7 '+handledCount+' of '+list.length+' handled') +
    banner +
    '<div class="inbox-list">' + lockedHTML + rows + '</div>';
}

function detailHTML(){
  var e = ALL_EMAILS.find(function(x){ return x.id===state.openId; });
  var saved = state.answers[e.id] || {};

  var notesHTML = '';
  if(e.notes){
    notesHTML = '<div class="memo-box"><span class="label">'+esc(e.notesLabel||'Notes')+'</span>' +
      e.notes.map(function(n){return '\u2022 '+esc(n);}).join('\n') + '</div>';
  }
  var boxHTML = e.box ? '<div class="memo-box"><span class="label">'+esc(e.boxLabel||'Reference')+'</span>'+esc(e.box)+'</div>' : '';
  var taskHTML = e.task ? '<div class="memo-box"><span class="label">Your task</span>'+esc(e.task)+'</div>' : '';
  var imgHTML = e.attachmentImage ? '<img class="memo-img" src="'+e.attachmentImage+'" alt="attachment">' : '';
  var materialBtnHTML = e.materialImage ? '<button class="material-btn" id="btn-material">'+esc(e.materialLabel||'View attached material')+'</button>' : '';

  var stamps = '<div class="stamp-row">';
  ACTIONS.forEach(function(a){
    var active = saved.action===a.key;
    stamps += '<button class="stamp'+(active?' active':'')+'" data-action="'+a.key+'" style="'+(active?('background:'+a.color+';border-color:'+a.color+';'):'')+'">'+a.key+'</button>';
  });
  stamps += '</div>';

  var responseHTML = '';
  if(e.requiresResponse){
    responseHTML =
      '<label class="field-label">Your response <span class="required-mark">(required)</span></label>' +
      '<textarea id="response-text" placeholder="Draft your reply or task note…">'+esc(saved.response||'')+'</textarea>';
  }

  var canConfirm = !!saved.action && (!e.requiresResponse || (saved.response && saved.response.trim().length>0));

  var hintHTML = '';
  if(!canConfirm){
    if(!saved.action && e.requiresResponse){
      hintHTML = '<div class="confirm-hint" id="confirm-hint">Pick a call above (DELETE / DELEGATE / DO / DEFER) and write your response to unlock this.</div>';
    } else if(!saved.action){
      hintHTML = '<div class="confirm-hint" id="confirm-hint">Pick a call above to unlock this.</div>';
    } else if(e.requiresResponse){
      hintHTML = '<div class="confirm-hint" id="confirm-hint">Write your response above to unlock this.</div>';
    }
  } else {
    hintHTML = '<div class="confirm-hint" id="confirm-hint"></div>';
  }

  return masthead('Email') +
    '<button class="detail-back" id="btn-back-inbox">\u2190 Back to inbox</button>' +
    '<div class="memo">' +
      (e.tag ? '<div class="ribbon" style="background:'+e.tagColor+'">'+esc(e.tag)+'</div>' : '') +
      '<div class="memo-body'+(e.tag?' with-ribbon':'')+'">' +
        '<div class="memo-row"><b>From</b> &nbsp;'+esc(e.from)+'</div>' +
        '<div class="memo-row"><b>Time</b> &nbsp;'+esc(e.time)+'</div>' +
        '<div class="memo-subject">'+esc(e.subject)+'</div>' +
        '<div class="memo-text">'+esc(e.body)+'</div>' +
        materialBtnHTML +
        notesHTML + boxHTML + taskHTML + imgHTML +
        (e.est ? '<div class="memo-footer"><span>Est. effort</span><span>'+esc(e.est)+'</span></div>' : '') +
      '</div>' +
    '</div>' +
    '<label class="field-label">Your call</label>' +
    stamps +
    responseHTML +
    hintHTML +
    '<button class="btn" id="btn-confirm"'+(canConfirm?'':' disabled')+'>Mark as handled</button>';
}

}

function warmupReviewShellHTML(){
  return masthead('<span class="live-dot"></span>Results \u00b7 live') +
    '<button class="detail-back" id="btn-back-warmupdone">\u2190 Back</button>' +
    '<div id="review-body"><p class="empty-note">Loading…</p></div>' +
    '<div class="stack"><button class="btn" id="btn-continue-round2">Continue</button></div>';
}

function bindReviewLive(bodyFn, showReset){
  if(!db) return;
  var bodyEl = document.getElementById('review-body');
  unsubscribeReview = onSnapshot(collection(db, COLLECTION_NAME), function(snapshot){
    var all = [];
    snapshot.forEach(function(d){ all.push(d.data()); });
    bodyEl.innerHTML = bodyFn(all);
    var resetBtn = document.getElementById('btn-reset');
    if(resetBtn) resetBtn.onclick = async function(){
      var code = prompt('Enter facilitator passcode to delete all submissions:');
      if(code===null) return;
      if(code !== FACILITATOR_DELETE_CODE){ alert('Incorrect passcode. Nothing was deleted.'); return; }
      if(!confirm('This clears every team\u2019s submitted answers. Continue?')) return;
      try{
        var snap = await getDocs(collection(db, COLLECTION_NAME));
        var deletes = [];
        snap.forEach(function(d){ deletes.push(deleteDoc(doc(db, COLLECTION_NAME, d.id))); });
        await Promise.all(deletes);
      }catch(e){ console.error(e); alert('Delete failed — check console.'); }
    };
  }, function(err){
    bodyEl.innerHTML = '<p class="empty-note">Could not load results: '+esc(err.message)+'. Check your Firestore security rules allow read access.</p>';
  });
}

function reviewCardsHTML(all, emailsList){
  var html = '';
  if(all.length===0){
    html += '<div class="landing-card"><p class="empty-note">No teams have submitted yet.</p></div>';
  } else {
    emailsList.forEach(function(e){
      var counts = {DELETE:0,DELEGATE:0,DO:0,DEFER:0};
      var responders = [];
      all.forEach(function(sub){
        var a = sub.answers && sub.answers[e.id];
        if(a && a.action){
          counts[a.action] = (counts[a.action]||0)+1;
          responders.push({team:sub.teamCode, action:a.action, response:a.response});
        }
      });
      var totalAnswered = responders.length;

      var origBoxHTML = e.box ? '<div class="memo-box"><span class="label">'+esc(e.boxLabel||'Reference')+'</span>'+esc(e.box)+'</div>' : '';
      var origTaskHTML = e.task ? '<div class="memo-box"><span class="label">Task</span>'+esc(e.task)+'</div>' : '';
      var origImgHTML = e.attachmentImage ? '<img class="memo-img" src="'+e.attachmentImage+'" alt="attachment">' : '';

      html += '<div class="review-email">';
      html += '<h3>'+e.id+' \u2014 '+esc(e.subject)+'</h3>';
      html += '<details class="original-email"><summary>View original email</summary>' +
        '<div class="memo-row"><b>From</b> &nbsp;'+esc(e.from)+'</div>' +
        '<div class="memo-row"><b>Time</b> &nbsp;'+esc(e.time)+'</div>' +
        '<div class="memo-text">'+esc(e.body)+'</div>' +
        origBoxHTML + origTaskHTML + origImgHTML +
        '</details>';

      ACTIONS.forEach(function(a){
        var c = counts[a.key]||0;
        var pct = totalAnswered>0 ? Math.round((c/totalAnswered)*100) : 0;
        html += '<div class="bar-row"><span class="bar-label">'+a.key+'</span>' +
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+a.color+'"></div></div>' +
          '<span class="bar-count">'+c+'</span></div>';
      });

      if(e.suggested){
        html += '<div class="suggested-note"><b>Suggested: '+esc(e.suggested)+'.</b>' +
          (e.alternative ? ' <i>Alternative: '+esc(e.alternative)+'.</i>' : '') + ' ' +
          (e.meaning?esc(e.meaning):'') + '</div>';
      }
      if(e.exampleResponse){
        html += '<div class="facilitator-note"><b>Example strong response:</b>\n'+esc(e.exampleResponse) +
          (e.scoringNote ? '\n\n'+esc(e.scoringNote) : '') + '</div>';
      }

      if(responders.length){
        html += '<div class="team-answers">';
        responders.forEach(function(r){
          var colorMap = {}; ACTIONS.forEach(function(a){colorMap[a.key]=a.color;});
          html += '<div class="team-answer"><span class="who">'+esc(r.team)+'</span>' +
            '<span class="chip" style="background:'+(colorMap[r.action]||'#999')+'">'+esc(r.action)+'</span>' +
            (r.response ? '<div style="margin-top:3px;">'+esc(r.response)+'</div>' : '') +
            '</div>';
        });
        html += '</div>';
      } else {
        html += '<p class="empty-note">No team has answered this one yet.</p>';
      }
      html += '</div>';
    });
  }
  return html;
}

function reviewBodyHTML(all){
  return reviewCardsHTML(all, EMAILS) +
    '<div class="footer-link" id="btn-reset">Reset all submissions (facilitator passcode required)</div>';
}

function warmupReviewBodyHTML(all){
  return reviewCardsHTML(all, WARMUP_EMAILS);
}

function bindEvents(){
  var el;
  if(el = document.getElementById('btn-start')){
    el.onclick = function(){
      var input = document.getElementById('team-name-input');
      var name = input ? input.value.trim() : '';
      if(!name){ alert('Please enter a team name.'); return; }
      startOrResumeTeam(name, false);
    };
  }
  if(el = document.getElementById('btn-skip-warmup')){
    el.onclick = function(){
      var input = document.getElementById('team-name-input');
      var name = input ? input.value.trim() : '';
      if(!name){ alert('Please enter a team name.'); return; }
      startOrResumeTeam(name, true);
    };
  }
  if(el = document.getElementById('btn-review')){
    el.onclick = function(){ state.screen='review'; render(); };
  }
  if(el = document.getElementById('btn-back-landing')){
    el.onclick = function(){ state.screen = state.teamCode ? 'inbox' : 'landing'; render(); };
  }
  if(el = document.getElementById('btn-back-warmupdone')){
    el.onclick = function(){ state.screen = 'warmupDone'; render(); };
  }
  if(el = document.getElementById('btn-warmup-review')){
    el.onclick = function(){ state.screen = 'warmupReview'; render(); };
  }
  if(el = document.getElementById('btn-continue-round2')){
    el.onclick = function(){
      state.round = 'main';
      state.screen = 'inbox';
      saveSubmission();
      render();
    };
  }
  document.querySelectorAll('[data-open]').forEach(function(row){
    row.onclick = function(){
      state.openId = row.getAttribute('data-open');
      state.screen = 'detail';
      render();
    };
  });
  if(el = document.getElementById('btn-material')){
    el.onclick = function(){
      var e = ALL_EMAILS.find(function(x){ return x.id===state.openId; });
      openModal(e.materialLabel || 'Material', '<img src="'+e.materialImage+'" alt="material">');
    };
  }
  if(el = document.getElementById('response-text')){
    el.oninput = function(){
      var e = ALL_EMAILS.find(function(x){ return x.id===state.openId; });
      var a = state.answers[e.id] || {};
      var hasResponse = el.value.trim().length>0;
      var ok = !!a.action && (!e.requiresResponse || hasResponse);
      var btn = document.getElementById('btn-confirm');
      if(btn) btn.disabled = !ok;
      var hint = document.getElementById('confirm-hint');
      if(hint){
        if(ok){ hint.textContent = ''; }
        else if(!a.action && e.requiresResponse){ hint.textContent = 'Pick a call above (DELETE / DELEGATE / DO / DEFER) and write your response to unlock this.'; }
        else if(!a.action){ hint.textContent = 'Pick a call above to unlock this.'; }
        else { hint.textContent = 'Write your response above to unlock this.'; }
      }
    };
  }
  if(el = document.getElementById('btn-back-inbox')){
    el.onclick = function(){
      saveCurrentResponse();
      state.screen = 'inbox';
      render();
    };
  }
  document.querySelectorAll('.stamp').forEach(function(s){
    s.onclick = function(){
      saveCurrentResponse();
      var e = ALL_EMAILS.find(function(x){ return x.id===state.openId; });
      if(!state.answers[e.id]) state.answers[e.id] = {};
      state.answers[e.id].action = s.getAttribute('data-action');
      render();
    };
  });
  if(el = document.getElementById('btn-confirm')){
    el.onclick = function(){
      saveCurrentResponse();
      var gained = maybeUnlockNext();
      saveSubmission();
      if(gained > 0) state.unlockBanner = gained;
      var list = currentEmails();
      var roundDone = countHandled(list) === list.length && currentUnlockedCount() === list.length;
      if(roundDone){
        state.screen = state.round === 'warmup' ? 'warmupDone' : 'done';
      } else {
        state.screen = 'inbox';
      }
      render();
    };
  }
}

function saveCurrentResponse(){
  if(!state.openId) return;
  var e = ALL_EMAILS.find(function(x){ return x.id===state.openId; });
  var ta = document.getElementById('response-text');
  if(!state.answers[e.id]) state.answers[e.id] = {};
  if(ta) state.answers[e.id].response = ta.value;
}

async function startOrResumeTeam(name, skipWarmup){
  state.teamCode = name;
  setHashCode(name);
  state.answers = {};
  state.round = skipWarmup ? 'main' : 'warmup';
  state.warmupUnlocked = WARMUP_BATCH_SIZES[0];
  state.mainUnlocked = BATCH_SIZES[0];
  state.screen = 'inbox';
  if(db){
    try{
      var snap = await getDoc(doc(db, COLLECTION_NAME, docIdFor(name)));
      if(snap.exists()){
        var data = snap.data();
        state.answers = data.answers || {};
        state.round = data.round || (skipWarmup ? 'main' : 'warmup');
        state.warmupUnlocked = data.warmupUnlocked || WARMUP_BATCH_SIZES[0];
        state.mainUnlocked = data.mainUnlocked || BATCH_SIZES[0];
        if(state.round === 'warmup'){
          var warmupHandled = countHandled(WARMUP_EMAILS);
          if(warmupHandled===WARMUP_EMAILS.length && state.warmupUnlocked===WARMUP_EMAILS.length) state.screen = 'warmupDone';
        } else {
          var mainHandled = countHandled(EMAILS);
          if(mainHandled===EMAILS.length && state.mainUnlocked===EMAILS.length) state.screen = 'done';
        }
      }
    }catch(e){ console.error('resume failed', e); }
  }
  saveSubmission();
  render();
}

async function init(){
  var resumeCode = getHashCode();
  if(resumeCode && db){
    await startOrResumeTeam(resumeCode);
    return;
  }
  render();
}

init();
</script>
